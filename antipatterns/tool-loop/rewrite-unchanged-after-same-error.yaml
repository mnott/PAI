# Rewriting a file byte-for-byte right after the proof it drives failed with the
# same error is no progress: the fix belongs in the code under test, not the driver.
# The 2nd such rewrite is stopped. (identical-write only counts consecutive writes of
# one file, so a worker interleaving two scratch files never reached its stop_at.)
id: rewrite-unchanged-after-same-error
layer: behaviour
status: stable
mode: enforce
version: 1
created: 2026-11-24
category: tool-loop
detector:
  kind: identical-write
  params:
    note_at: 1
    stop_at: 2
    stop_message: "loop guard: you rewrote {file} unchanged after the same failure. Read the code the proof drives and change that, not the driver."
action: stop
message: "You rewrote {file} unchanged after the same failure. Read the code the proof drives and change that, not the driver."
tests:
  match:
    - "A fail A fail A"
  no_match:
    - "A"
    - "A fail A"
    - "A fail B fail A"
    - "A fail A ok A"
provenance:
  date: 2026-11-24
  model: Paperfull
  observed: worker 20261123-135804-43914 rewrote a scratch proof driver with identical content 3 times after the same failing proof ("folder 2 not found in [data-testid=staging-list]"); identical-write caught it only after ~10 minutes
  ref: forge #26 part 1
