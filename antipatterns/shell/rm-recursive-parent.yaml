# Recursive deletion of the parent directory.
id: rm-recursive-parent
status: stable
mode: enforce
version: 1
created: 2026-10-25
severity: block
quoted: true
category: catastrophic_deletion
flags: m
match: /{{RMREC}}\.\.(?:\/\.\.)*\/*\*?{{ARGEND}}/
reason: recursive rm of .. or ../ deletes the parent directory
tests:
  match:
    - bash -c "rm -rf ../"
    - rm -rf ../
    - rm -rf ..
    - rm -rf ../..
    - rm -rf ../ && echo done
    - sh -c "rm -rf .."
  no_match:
    - rm -rf ../build
    - rm -rf ..foo
