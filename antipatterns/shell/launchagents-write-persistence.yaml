# Writing a plist into LaunchAgents registers a startup item.
id: launchagents-write-persistence
status: stable
mode: enforce
version: 1
created: 2026-10-25
severity: confirm
flags: m
match: /(?:>>?|{{CMD}}(?:tee|cp|mv)\b[^|;&]*)\s*(?:~\/Library\/LaunchAgents\/|\$HOME\/Library\/LaunchAgents\/|\/Library\/LaunchAgents\/)/
reason: writing into a LaunchAgents directory registers a startup item
tests:
  match:
    - cp agent.plist $HOME/Library/LaunchAgents/
    - cp agent.plist ~/Library/LaunchAgents/
    - tee -a /Library/LaunchAgents/com.example.agent.plist
  no_match:
    - ls ~/Library/LaunchAgents
