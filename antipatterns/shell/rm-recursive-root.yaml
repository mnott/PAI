# Recursive rm of /, ~, $HOME or a system directory.
# {{RMREC}} puts the destructive verb in command position (line start, after
# ; & | ( { ` $( then/do/else, sh -c ", behind prefix wrappers such as sudo,
# env, command, a leading backslash or an absolute path), so `~`, `/` and `-`
# inside awk programs or python strings never match on their own.
id: rm-recursive-root
status: stable
mode: enforce
version: 1
created: 2026-10-25
severity: block
quoted: true
category: catastrophic_deletion
flags: m
match: /{{RMREC}}(?:\/+\.?\*?|~\/*\*?|\$\{?HOME\}?\/*\*?|\/(?:usr(?:\/(?:local|lib|bin|sbin|share|include))?|etc|bin|sbin|lib|lib64|var|opt|boot|dev|root|System|Library|Applications|Users(?:\/[^\s\/;&|"']+)?|home(?:\/[^\s\/;&|"']+)?)\/*\*?){{ARGEND}}/
reason: recursive rm aimed at /, the home directory or a system directory
tests:
  match:
    - rm -rf /
    - rm -rf ~
    - rm -rf $HOME
    - sudo rm -rf /usr
    - rm -rf "/"
    - rm -rf "$HOME"
    - rm -rf '/'
    - sh -c "rm -rf /"
    - bash -c 'rm -rf /'
    - bash -lc "rm -rf /"
    - sh -c "bash -c 'rm -rf /'"
    - sh -c "sudo rm -rf /"
    - sh -c "rm -rf $HOME"
    - (rm -rf /)
    - \rm -rf /
    - /bin/rm -rf /
    - command rm -rf /
    - env rm -rf /
    - exec rm -rf /
    - nohup rm -rf /
    - time rm -rf /
    - sudo env rm -rf /
    - xargs rm -rf /
    - "{ rm -rf /; }"
    - if true; then rm -rf /; fi
    - for i in 1; do rm -rf /; done
    - $'rm' -rf /
    - rm -rf /.
    - rm -rf //
    - rm -rf ~//
    - rm -rf /usr/local
    - rm -rf /Users/bob
    - rm -rf ~/*
    - rm -rf -- /
    - FOO=1 rm -rf /
  no_match:
    - "rm -rf node_modules; ls /"
    - rm -rf dist && du -sh /
    - rm -r build && ls ~
    - rm -rf /tmp/build
    - rm -rf ~/tmp/build
    - rm -rf /usr/local/lib/foo
    - rm -rf /Users/bob/project
    - git rm -rf ./
    - echo "rm -rf /"
    - awk -F'\t' '$2 ~ /-anthropic-precise-00/ {print $1,$3,$8,$9}' file
    - "python3 -c \" import math\ndef distance(p, a, b): return abs((b[0]-a[0])*(a[1]-p[1]) - (a[0]-p[0])*(b[1]-p[1])) / max(math.hypot(a[0]-b[0], a[1]-b[1]), 1e-9) ~ 1 \""
