# A recursive search rooted at ~, $HOME, /Users/<name> or / walks synced
# libraries and 100 GB model files (incident 2026-10-25) or hogs the machine
# (find / at load 200, 2026-10-14). Deeper paths and mdfind (an index) are fine.
# The `.`/no-path form under a cd to the home directory is caught in worker-guard.ts.
id: recursive-search-root
layer: baseline
status: stable
mode: enforce
version: 1
created: 2026-10-25
severity: block
quoted: true
category: resource_exhaustion
flags: m
match: /{{CMD}}(?:timeout\s+(?:-[^\s;&|]+\s+)*\d+[smhd]?\s+)?(?:(?:find|fd|fdfind|rg|ag)(?=\s)|grep(?=\s)(?=[^;&|]*\s(?:-\w*[rR]\w*|--recursive)(?=\s)))(?:\s+[^\s;&|]+){0,16}?\s+["']?(?:~|\$\{?HOME\}?|\/Users\/[^\s\/;&|"']+|\/)\/*{{ARGEND}}/
reason: recursive search over the home directory or / is blocked; search a named project or cache directory, e.g. rg -n PATTERN ~/strata-020 (mdfind uses the index and is fine)
tests:
  match:
    - cd /Users/someone; timeout 100 grep -rl "TQP5 / TQP6 / TQP7" --include=ggml-quants.c /Users/someone | head
    - grep -rn foo ~
    - rg foo ~/
    - find / -name x
    - fd x $HOME
    - fd x ${HOME}
    - grep -R foo /Users/someone
    - grep --recursive foo /
    - grep -rn foo "$HOME"
    - ag foo /Users/someone/
    - sudo find / -name x
  no_match:
    - rg foo ~/strata-020
    - grep -rn foo src/
    - find /tmp/build -name x
    - mdfind -name x
    - grep foo ~/file.txt
    - grep foo ~
    - grep -rn foo ~/.cache/pai/x
    - rg foo /Users/someone/dev/ai/PAI
    - echo "find /" 
    - ls ~ && grep -rn foo src
