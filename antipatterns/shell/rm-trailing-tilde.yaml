# rm with a trailing ~/ argument deletes the home directory.
id: rm-trailing-tilde
layer: baseline
status: stable
mode: enforce
version: 1
created: 2026-10-25
severity: block
quoted: true
category: catastrophic_deletion
flags: m
match: /{{CMD}}rm(?=\s)(?:\s+[^\s;&|]+){1,16}?\s+["']?~\/*{{ARGEND}}/
reason: rm with a trailing ~/ argument deletes the home directory
tests:
  match:
    - cd /tmp && rm -rf ~/
  no_match:
    - rm -rf ~/tmp/build
