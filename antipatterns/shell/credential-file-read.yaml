# Reading a credential file puts secrets in the transcript.
id: credential-file-read
status: stable
mode: enforce
version: 1
created: 2026-10-25
severity: warn
flags: m
match: /{{CMD}}(?:cat|less|more|head|tail|cp|copy|scp)\b[^|;&]*\/(?:\.ssh\/id_\w*|\.aws\/credentials|\.netrc)\b/
reason: a credential file is being read or copied
tests:
  match:
    - cat ~/.ssh/id_rsa
    - cp ~/.aws/credentials /tmp/aws
    - cat ~/.netrc
    - /bin/cat ~/.netrc
  no_match:
    - ls ~/.ssh
    - cat ~/.ssh/config
