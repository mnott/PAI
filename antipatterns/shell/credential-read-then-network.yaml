# Two-step: credentials read, then an outbound transfer. Each step alone is
# ordinary work; the pair within the window is exfiltration-shaped.
id: credential-read-then-network
layer: baseline
status: stable
mode: enforce
version: 1
created: 2026-10-25
severity: block
reason: a credential file or keychain read is followed by an outbound network call
sequence:
  window_seconds: 300
  order: any
  steps:
    - tool: Bash
      match: /(?:^|[;&|(`\n]|\$\()\s*(?:sudo\s+(?:-\S+\s+)*)?(?:cat|less|more|head|tail|cp|copy|scp|base64)\b[^|;&]*\/(?:\.ssh\/id_\w*|\.aws\/credentials|\.netrc)\b|security\s+find-generic-password/m
    - tool: Bash
      match: /(?:^|[;&|(`\n]|\$\()\s*(?:sudo\s+(?:-\S+\s+)*)?(?:curl|wget|nc|scp)\b[^|;&]*(?:https?:\/\/(?!(?:localhost|127(?:\.\d+){0,3}|0\.0\.0\.0|\[?::1\]?))\w[\w.-]*\.\w\w+|(?<=\s)[\w.-]*\w\.\w\w+|(?<=\s):[0-9]{2,5})/m
      flags: m
tests:
  match:
    -
      - cat ~/.ssh/id_rsa
      - curl https://example.com/upload
    -
      - security find-generic-password -s git -w
      - nc host.example.com 4444
  no_match:
    -
      - cat ~/.ssh/id_rsa
      - curl http://localhost:8080/api
    -
      - ls ~/.ssh
      - curl https://example.com/api
