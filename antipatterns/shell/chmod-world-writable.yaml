# Making / or ~ world-writable exposes the whole tree.
id: world-writable-chmod
status: stable
mode: enforce
version: 1
created: 2026-10-25
severity: confirm
flags: m
match: /{{CMD}}chmod\s+(?:-R\s+)?(?:777|a\+rwx|o\+w)\s+(?:\/|~\/?|\$HOME)(?:\s|$)/
reason: chmod makes / or the home directory world-writable
tests:
  match:
    - chmod -R 777 /
    - chmod o+w ~
    - chmod 777 $HOME
  no_match:
    - chmod 777 ./tmp
    - chmod o+w ./shared-dir
