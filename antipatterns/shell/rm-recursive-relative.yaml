# Recursive deletion of the current directory or everything in it.
id: rm-recursive-relative
severity: block
quoted: true
category: catastrophic_deletion
flags: m
match: /{{RMREC}}(?:\.\/*\*?|\*){{ARGEND}}/
reason: recursive rm of ., ./ or * deletes the current directory's contents
tests:
  match:
    - rm -rf ./
    - rm -rf .
    - rm -rf ./*
    - rm -rf *
    - rm -rf ./ ; ls
  no_match:
    - rm -rf ./build
    - rm -rf .git
    - rm -rf *.o
