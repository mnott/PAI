# Loading a launchd agent persists a background job.
id: launchctl-load-persistence
status: stable
mode: enforce
version: 1
created: 2026-10-25
severity: confirm
flags: m
match: /{{CMD}}launchctl\s+(?:load|bootstrap)\b/
reason: loading a launchd agent persists a background job
tests:
  match:
    - launchctl load ~/Library/LaunchAgents/com.example.agent.plist
  no_match:
    - launchctl list
