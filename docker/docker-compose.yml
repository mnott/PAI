version: "3.9"

services:
  pgvector:
    image: pgvector/pgvector:pg17
    container_name: pai-pgvector
    restart: unless-stopped
    # Postgres ships with shared_buffers=128MB, which is far too small once the
    # vector index runs to a gigabyte or more — the index can never stay cached
    # and every similarity search hits disk. 25% of available RAM is the usual
    # rule. Override these if your Docker VM is smaller or larger:
    # shared_buffers must fit inside the VM or Postgres will not start.
    command: >
      postgres
      -c shared_buffers=${PAI_PG_SHARED_BUFFERS:-1GB}
      -c effective_cache_size=${PAI_PG_EFFECTIVE_CACHE_SIZE:-3GB}
      -c maintenance_work_mem=${PAI_PG_MAINTENANCE_WORK_MEM:-256MB}
    environment:
      POSTGRES_USER: pai
      POSTGRES_PASSWORD: pai
      POSTGRES_DB: pai
    ports:
      # Bind to localhost only — not exposed to the network
      - "127.0.0.1:5432:5432"
    volumes:
      # Data lives on the host, not in a Docker-managed volume, so it is
      # visible, browsable and covered by normal host backups.
      - ~/.pai/pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pai -d pai"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # No memory limit here on purpose. Postgres is bounded by its own
    # shared_buffers and work_mem, and Docker Desktop already caps the VM this
    # container runs in — a second, lower ceiling only stops the vector index
    # being cached. Tune the VM allocation in Docker Desktop instead.
