# PAI shipped defaults — the workers config.
#
# Loaded FIRST and deep-merged UNDER the user's ~/.pai/workers.yaml: user
# values win, arrays replace, objects merge. Edit the user file, never this
# one; `pai config get <key> --source` shows which file a value came from.
# Policy values live here, not in code — the code keeps only the types and the
# loader (src/config/shipped-defaults.ts).
#
# The `workers` section holds the non-provider settings that live in the main
# config (pane, routing, tree, pool, …); providers/classes/mcp_sets/active
# live at the top level of workers.yaml.

workers:
  enabled: false
  pane:
    enabled: true
    fontSize: 13
    autoExitSecs: 5
  logDir: ~/.claude/logs/workers
  routing:
    # Provider names in preference order; first usable one wins.
    order: []
    # Minutes a provider sits in cooldown after a quota/rate failure.
    cooldownMinutes: 30
    # Reroute a failed-before-first-tool run to the next provider.
    retryOnQuota: true
    # Auto-routing policy: "budget" (skip providers at/above their budget
    # wall) or "order" (walk routing.order verbatim).
    policy: budget
    # Operator preference order for policy "budget"; empty falls back to
    # routing.order, else routing.budgetPriority.
    priority: []
    # Per-provider overrides of routing.budgetPercent; percent used at which
    # budget routing treats the provider as full.
    budgetWalls: {}
    # Provider names budget routing walks when priority and order are both
    # empty; unconfigured names are skipped.
    budgetPriority: [anthropic, glm, kimi]
    # Budget wall for a provider budgetWalls and budgetPercent name none.
    budgetWall: 95
    # Budget walls budget routing uses when routing.budgetWalls names none:
    # percent used at which the provider counts as full.
    budgetPercent:
      anthropic: 95
      glm: 90
      kimi: 85
  tree:
    # Maximum nesting depth of sub-workers (top-level = 0).
    maxDepth: 2
    # Maximum concurrently running children per parent.
    maxChildren: 4
  supervision:
    # Type "N worker alerts pending" lines into session panes; default off.
    pointer: false
    # Which alerts reach the orchestrating session: "harness" (harness-class
    # tool errors, loop detections, stalls) or "all".
    push: harness
    # Minutes without a tool call before a running unit counts as stalled.
    stallMinutes: 10
  # Loopback port of the PAI openai-protocol proxy (workers/proxy).
  proxy:
    port: 8797
  # Worker session pool: long-lived headless slots that successive small runs
  # talk to, so the provider prompt cache carries over. OFF — the operator
  # turns it on with `pai worker pool on`.
  pool:
    enabled: false
    # Maximum slot processes the host keeps, across all (provider, model) keys.
    maxSlots: 3
    # Idle seconds before a slot is killed (0 = never); the cache the pool
    # exists to carry is gone by then anyway.
    idleSecs: 900
    # Loopback port the pool host listens on.
    port: 8798
    # Native anthropic (Claude Code's own login) runs may use pooled slots;
    # worktree runs never do.
    native: true
    # Reserve spares (pre-made worktree + waiting claude per repo): off. A
    # worker's worktree is made when it starts and removed when it ends.
    spares: 0
    # Idle seconds before an unclaimed spare is retired (0 = never).
    idleKillSec: 1800
    # The old multi-task continuation path; default off.
    continuation: false
  # Daemon cache-keepalive cadence in seconds: how often a trivial heartbeat
  # worker re-arms the provider prompt cache. 0 = off — arming it is the
  # operator's explicit call.
  cacheKeepaliveSecs: 0
  # Default time limit of every run in minutes; 0 = none.
  defaultMaxMinutes: 60
  # Minutes a run may queue for a slot before the owner is told.
  waitAlarmMinutes: 120
  # Milliseconds the end-of-run security scan may take before it is skipped.
  scanBudgetMs: 5000
  # Start gate for same-provider runs.
  stagger:
    enabled: true
    # Limit without history, per provider kind (seconds).
    localDefaultSec: 20
    remoteDefaultSec: 8
    # Clamp of the learned limit (seconds).
    minSec: 3
    maxSec: 120
  # Per-provider concurrency cap.
  capacity:
    enabled: true
    # Admission cap of a loopback provider that exposes none (one local engine
    # serves one request at a time).
    localDefaultCap: 1
    # Cap used for a provider with no cap at all (cloud, unset) by the queue
    # and plan runners.
    uncappedQueueCap: 3
    # A run queued this long raises the max-total-wait alarm (milliseconds);
    # the alarm only tells the owner, it never kills or skips the run.
    maxTotalWaitMs: 7200000
    # Longest silence of the log while queued, in milliseconds.
    heartbeatMs: 60000
    # A ticket waiting longer than this jumps ahead of newer tickets of any
    # session (milliseconds).
    agingMs: 900000
  # Queue admission priority. When a provider is full, queued runs are admitted
  # high before normal before low (oldest first within a priority, sessions
  # taking turns); running workers are never preempted. A run's priority is
  # `pai worker run --priority high|normal|low`, else its session's entry here,
  # else normal.
  priority:
    # Named session -> priority of every run it starts, e.g.
    #   sessions: { "Jobs": high, "Background": low }
    sessions: {}
  # Local-model idle watcher.
  localIdle:
    enabled: true
    # GPU busy percent under which local models count as idle.
    gpuBelowPct: 10
    # Minutes idle before the watcher fires.
    minutes: 2
    # Minutes between repeat notices.
    backoffMinutes: 10
  # Escalation one tier up (escalation.ts): a run whose context passes
  # contextFraction of the model's window, that is missing a tool it needs, or
  # that failed `failures` times on the same task goes one tier up — t2 -> t1
  # re-runs on the tier above starting from the salvaged branch, t1 -> t0
  # messages the owning session (never silently). Off when `enabled: false`;
  # `triggers` picks which of the three rules are on.
  escalate:
    enabled: true
    # Fraction (0..1] of the model's context window that triggers escalation.
    contextFraction: 0.7
    # Failed attempts of one task that escalate it.
    failures: 2
    # Which triggers are on: context, missing-tool, repeated-failure, and
    # loop-stop (a loop-guard stop that left committed or salvaged work
    # escalates at once, without waiting for `failures`), and deadline (the
    # same for a run stopped by --max-minutes / --deadline). With nothing saved
    # both fall back to the repeated-failure rule.
    triggers: [context, missing-tool, repeated-failure, loop-stop, deadline]
    # Where an escalated plan/queue part runs (--escalate takes `tier`) and the
    # default provider/model of `pai worker help`: tier label, provider name
    # (a key of providers, or the built-in anthropic), model alias or id.
    cloud:
      tier: sonnet
      provider: anthropic
      model: sonnet
  # Loop guard: a denied repeat of a read-only call (Bash read, Read, Grep,
  # Glob) gets the call's last output back, trimmed to these sizes, so the
  # model stops asking for it again. Secret-looking lines are masked.
  loopGuard:
    echoLines: 40
    echoChars: 3000
    # A denied re-run of a test/build command gets the last N lines of its
    # previous output (within echoChars), where failures and summaries are.
    echoRunnerLines: 40
  # Runs strip browser tools unless --browser is passed.
  noBrowserByDefault: false
  # Hourly gc archives finished workers' worktrees older than this many hours.
  gcOlderThanHours: 6
  # Size cap in GB of the worktrees dir; over it, gc archives the oldest
  # finished ones.
  worktreesMaxGb: 20
  # Daemon reaper for orphaned worker processes.
  reaper: true
  # Cost tier used when a provider names none (1 cheapest … 5 most expensive).
  costTier: 3
  # Budget-routing skip percentage used when a provider names none.
  quotaSkipAt: 95

# Providers PAI can run workers on. The built-in `anthropic` provider is
# Claude Code's own login; its model table is the shipped default below (a
# user's providers.anthropic.models merges over it).
providers:
  anthropic:
    builtin: true
    models:
      # Workers exist to parallelise and to save cost, so they never inherit
      # the orchestrator's model. These are the Claude Code CLI's own tier
      # aliases: the CLI resolves each to its newest model on every run.
      default: sonnet
      fast: haiku

# Chat model alias of the built-in login's own orchestrator session. Not a
# worker model: it passes through on the native provider only. A value in the
# user's workers.yaml wins over this one.
orchestratorModel: opus

# Optional top-level `local: <provider>` (not set here): the preferred local
# model when several local servers answer (`--local`, `local`). It is the
# fallback when no model of the routing tier order (tiers above) is running.

# USD per million tokens by model family, matched on the model name (`pai audit
# usage`, transcript cost). A user's prices merges over this per family.
prices:
  opus: { input: 5, output: 25 }
  sonnet: { input: 3, output: 15 }
  haiku: { input: 1, output: 5 }

# The default MCP sets every config starts from; a user's mcp_sets merges
# over this, so `desktop: []` removes the set deliberately. `desktop` names
# the clickr server so `--mcp desktop` hands a worker the machine controls.
mcp_sets:
  desktop: [clickr]

# The default delegation table: one row per tier, each an ordered model list
# (the first available entry serves, the rest is the fallback order), plus the
# class -> tier mapping in each tier's `classes` key. A user's workers.yaml
# `tiers:` replaces this list wholesale (arrays replace — no concatenation);
# edit a row with `pai worker route set <tier|class> <provider/model,...>`
# (it writes the user file) or write your own `tiers:` block.
tiers:
  - id: t0
    name: Session
    description: The interactive session itself; PAI starts sessions on it.
    models:
      - anthropic/opus
      - glm/glm-5.3
    session: true
    note: you; cloud before local only for context width or reasoning
  - id: t1
    name: Orchestrator
    description: Splits a job, plans and reviews; its workers implement the parts.
    models:
      - anthropic/sonnet
      - glm/glm-5.3-flash
    classes:
      - orchestrate
      - plan
    note: splits and plans; cloud before local only for reasoning
  - id: t2
    name: Worker
    description: Implements the parts and runs quick checks.
    models:
      - local
      - anthropic/sonnet
      - glm/glm-5.3-flash
    classes:
      - implement
      - research
      - draft
      - review
      - complex
      - simple
      - spotcheck
    default: true
    note: implements; local first, cloud before local only for context width

# The class -> tier mapping lives in the tiers' `classes` keys above (the
# standard classes: draft, plan, implement, review, research, spotcheck,
# simple, complex, image). A user's `classes:` map replaces the shipped map
# wholesale when it names any class; routing itself reads the tier lists.
classes: {}
