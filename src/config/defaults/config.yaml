# PAI shipped defaults — the main config (config.yaml / config.json).
#
# Loaded FIRST and deep-merged UNDER the user's ~/.pai/config.yaml (or
# config.json): user values win, arrays replace, objects merge. Edit the user
# file, never this one; `pai config get <key> --source` shows which file a
# value came from. Policy values live here, not in code — the code keeps only
# the types and the loader (src/config/shipped-defaults.ts).
#
# Values computed at load time (never stored here): socketPath (PAI_SOCKET_PATH
# or /tmp/pai.sock), postgres.connectionString (per-user database name).

# How often the daemon re-indexes changed files, in seconds.
indexIntervalSecs: 300
# How often the daemon runs the embedding pass, in seconds.
embedIntervalSecs: 600
# Obsidian sync interval, in seconds; syncs only if a hook flagged a change.
obsidianSyncIntervalSecs: 1800
# Run an embed pass 60s after daemon start. Off by default: with a large
# backlog it makes every restart a CPU storm.
embedOnStartup: false
# Wall-clock budget of one embed pass in minutes; the backlog continues next cycle.
embedMaxMinutes: 60
# Load average above which an embed pass yields. Also yields while a
# local-model worker runs.
embedMaxLoad: 8
# Priority of scheduled index/embed passes: "background" (low-priority child
# process) or "normal" (in-process).
passPriority: background
# Storage backend: "sqlite" or "postgres".
storageBackend: sqlite
# PostgreSQL connection settings, used when storageBackend is "postgres"
# (connectionString is derived per user at load time).
postgres:
  maxConnections: 5
  connectionTimeoutMs: 5000
# Embedding model name, used for semantic/hybrid search.
embeddingModel: Snowflake/snowflake-arctic-embed-m-v1.5
# Embedding backend: backend ("transformers-cpu-q8" or "ollama-f16"), model,
# ollama.baseUrl. Switching needs `pai memory reembed`.
embedding:
  backend: transformers-cpu-q8
  ollama:
    baseUrl: http://127.0.0.1:11434
# Daemon log level: debug, info, warn, or error.
logLevel: info
# Notices to the session and to PAILot: the throttles and windows of the
# notice path (the PAILot gate, the run/queue reporters, worker trouble).
notices:
  # The PAILot gate (src/workers/pailot-guard.ts).
  pailot:
    # Messages that may leave per window, from all PAI processes; the excess
    # is dropped with one summary line per window.
    maxPerMinute: 5
    # How long a sent text counts as a duplicate (persisted marker lifetime).
    dedupHours: 24
    # The rate window.
    windowSecs: 60
  # Run/queue reports into the originating session (src/workers/run-events.ts).
  runReports:
    # At most one grouped unit-done message per this span.
    planGroupThrottleMinutes: 15
    # Ready queue items batch into one message per this span.
    queueReadyBatchMinutes: 10
  # Worker trouble notices to the starting session (src/workers/worker-trouble.ts).
  trouble:
    # At most one trouble message per worker per this span; hard stops bypass.
    throttleMinutes: 5
    # Guard denials count towards the threshold within this span.
    denialWindowMinutes: 10
    # Denials in the window before the session is told.
    denialThreshold: 3
    # No output for this long while running tells once per quiet spell.
    stallMinutes: 10
# Notification subsystem configuration.
notifications:
  mode: auto
  channels:
    ntfy:
      enabled: false
      priority: default
    whatsapp:
      enabled: true
    macos:
      enabled: true
    voice:
      enabled: false
      voiceName: bm_george
    cli:
      enabled: true
  routing:
    error: [whatsapp, macos, ntfy, cli]
    completion: [whatsapp, macos, ntfy, cli]
    info: [cli]
    progress: [cli]
    debug: []
# Search defaults, applied when an MCP tool or CLI call doesn't specify one.
search:
  mode: keyword
  rerank: true
  recencyBoostDays: 90
  defaultLimit: 10
  snippetLength: 200
# Task bus — optional external tracker for cross-session work.
tasks:
  enabled: false
  providers:
    todoist:
      enabled: false
  autoDispatch: false
# Who "me" is — addresses that count as the user's own. Empty by default and
# never guessed: nothing is self-addressed until this is set.
identity:
  selfEmails: []
# Interactive-session settings (currently just the cache keepalive).
sessions:
  cacheKeepalive:
    # Off by default — arming it is the operator's explicit call.
    enabled: false
    # Beat a session once it has been idle at least this long; must be < the
    # provider's cache TTL (60 for the 1h ephemeral cache).
    idleMinutes: 50
    # Cap on consecutive beats per idle stretch.
    maxBeats: 6
    # Local time window outside which no beats are sent.
    activeHours: "08:00-22:00"
    # Skip sessions whose context is too small to be worth a beat.
    minContextTokens: 20000
    # The exact word typed into the session.
    prompt: keepalive
# Read-only status dashboard.
dashboard:
  enabled: true
  port: 8770
  bind: 127.0.0.1
# Obsidian sync into the PAI-generated vault. Gates only writing; vault
# indexing is vaultIndex.
obsidian:
  enabled: false
# Read-only indexing of vaultPath for memory search. Independent of
# obsidian.enabled.
vaultIndex:
  enabled: true
# Keep `pai router` (127.0.0.1:8790) running under the daemon.
router:
  enabled: false
  bind: loopback
  # Cockpit page layout policy (src/router/cockpit-layout.ts): grid breakpoints,
  # column counts, tile min/max widths, chart heights, sample/history window
  # lengths, refresh intervals, row limits, fold defaults. Read at page build
  # time; a user config.yaml/json override changes the served page. Pure
  # styling (fonts, colours from the theme mapping) stays in the page's CSS.
  cockpit:
    layout:
      # main grid: 12 columns; c8/c6/c4 cards go full width below this width.
      gridBreakpointPx: 1000
      # cloud/local gauge tiles (flex row): base width, cap.
      gaugeMinWidthPx: 110
      gaugeMaxWidthPx: 120
      # provider group cards in the responsive grid: min column width.
      providerTileMinPx: 260
      # models runtime cards: min column width of the rt-grid.
      runtimeCardMinPx: 420
      # metric tiles inside a runtime card: 4 columns at/above the container
      # breakpoint, 2 below it, 1 at/below the one-column breakpoint.
      tilesWideBreakpointPx: 720
      tilesWideCols: 4
      tilesNarrowCols: 2
      tilesOneColBreakpointPx: 339
      # cache rings grid: min column width.
      ringMinWidthPx: 92
      # sessions table: max width of the title column.
      sessionTitleMaxWidthPx: 480
      # metric-tile sparkline: height, viewBox width, plot top, plot height.
      sparkHeightPx: 32
      sparkViewMaxPx: 100
      sparkPlotHeightPx: 28
      sparkPlotTopPx: 30
      # cache donut: solo size, ring size, radius, stroke width, viewBox size.
      bigDonutSizePx: 170
      donutSizePx: 84
      donutRadiusPx: 48
      donutStrokePx: 16
      donutViewBoxPx: 140
      # chart canvases (SVG viewBox sizes).
      tokensChartWidthPx: 760
      tokensChartHeightPx: 220
      powerChartWidthPx: 760
      powerChartHeightPx: 150
      dailyChartWidthPx: 520
      dailyChartHeightPx: 200
      # history window of the "Tokens per day per model" chart, in days.
      dailyDays: 14
      # table row limits: sessions by tokens, worker runs.
      sessionsRows: 20
      workerRows: 15
      # models under this many requests render as chips, not rings.
      lowRequestMin: 5
      # refresh intervals of the page's polls.
      pollMs: 5000
      limitsPollMs: 30000
      poolPollMs: 15000
      clockTickMs: 1000
      # the stamp reads "stale" past this age, in seconds.
      stampStaleSecs: 15
      # a local switch/off job: first delay, poll interval, max tries.
      jobFirstDelayMs: 2000
      jobPollMs: 5000
      jobMaxTries: 120
      # a server prefix-cache counter older than this (seconds) is marked.
      serverCounterStaleSecs: 60
      # fold default: a model card whose kind equals this opens, the rest fold.
      foldDefaultKind: coding

# Cockpit Models cards: the title of PAI's own embedding consumer (the purpose
# of the model). Override in ~/.pai/config.yaml under models.embeddingLabel.
models:
  embeddingLabel: PAI memory embeddings
