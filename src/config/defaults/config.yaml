# PAI shipped defaults — the main config (config.yaml / config.json).
#
# Loaded FIRST and deep-merged UNDER the user's ~/.pai/config.yaml (or
# config.json): user values win, arrays replace, objects merge. Edit the user
# file, never this one; `pai config get <key> --source` shows which file a
# value came from. Policy values live here, not in code — the code keeps only
# the types and the loader (src/config/shipped-defaults.ts).
#
# Values computed at load time (never stored here): socketPath (PAI_SOCKET_PATH
# or /tmp/pai.sock), postgres.connectionString (per-user database name).

# How often the daemon re-indexes changed files, in seconds.
indexIntervalSecs: 300
# How often the daemon runs the embedding pass, in seconds.
embedIntervalSecs: 600
# Obsidian sync interval, in seconds; syncs only if a hook flagged a change.
obsidianSyncIntervalSecs: 1800
# Run an embed pass 60s after daemon start. Off by default: with a large
# backlog it makes every restart a CPU storm.
embedOnStartup: false
# Wall-clock budget of one embed pass in minutes; the backlog continues next cycle.
embedMaxMinutes: 60
# Embed batches in flight at once; Ollama runs them in parallel up to OLLAMA_NUM_PARALLEL.
embedConcurrency: 3
# Total window of one anchored cycle's embed phase: passes repeat until the
# backlog is empty or this many minutes are spent.
embedCycleMaxMinutes: 300
# Minutes to wait before resuming after a pass yielded to load or a local worker.
embedResumeMinutes: 10
# Load average above which an embed pass yields. Also yields while a
# local-model worker runs.
embedMaxLoad: 8
# Priority of scheduled index/embed passes: "background" (low-priority child
# process) or "normal" (in-process).
passPriority: background
# Storage backend: "sqlite" or "postgres".
storageBackend: sqlite
# PostgreSQL connection settings, used when storageBackend is "postgres"
# (connectionString is derived per user at load time).
postgres:
  maxConnections: 5
  connectionTimeoutMs: 5000
# Embedding model name, used for semantic/hybrid search.
embeddingModel: Snowflake/snowflake-arctic-embed-m-v1.5
# Embedding backend: backend ("transformers-cpu-q8" or "ollama-f16"), model,
# ollama.baseUrl. Switching needs `pai memory reembed`.
embedding:
  backend: transformers-cpu-q8
  ollama:
    baseUrl: http://127.0.0.1:11434
# Daemon log level: debug, info, warn, or error.
logLevel: info
# Notices to the session and to PAILot: the throttles and windows of the
# notice path (the PAILot gate, the run/queue reporters, worker trouble).
notices:
  # The PAILot gate (src/workers/pailot-guard.ts).
  pailot:
    # Messages that may leave per window, from all PAI processes; the excess
    # is dropped with one summary line per window.
    maxPerMinute: 5
    # How long a sent text counts as a duplicate (persisted marker lifetime).
    dedupHours: 24
    # The rate window.
    windowSecs: 60
  # Run/queue reports into the originating session (src/workers/run-events.ts).
  runReports:
    # At most one grouped unit-done message per this span.
    planGroupThrottleMinutes: 15
    # Ready queue items batch into one message per this span.
    queueReadyBatchMinutes: 10
  # Worker trouble notices to the starting session (src/workers/worker-trouble.ts).
  trouble:
    # At most one trouble message per worker per this span; hard stops bypass.
    throttleMinutes: 5
    # Guard denials count towards the threshold within this span.
    denialWindowMinutes: 10
    # Denials in the window before the session is told.
    denialThreshold: 3
    # No output for this long while running tells once per quiet spell.
    stallMinutes: 10
# Notification subsystem configuration.
notifications:
  mode: auto
  channels:
    ntfy:
      enabled: false
      priority: default
    whatsapp:
      enabled: true
    macos:
      enabled: true
    voice:
      enabled: false
      voiceName: bm_george
    cli:
      enabled: true
  routing:
    error: [whatsapp, macos, ntfy, cli]
    completion: [whatsapp, macos, ntfy, cli]
    info: [cli]
    progress: [cli]
    debug: []
# Search defaults, applied when an MCP tool or CLI call doesn't specify one.
search:
  mode: keyword
  rerank: true
  recencyBoostDays: 90
  defaultLimit: 10
  snippetLength: 200
# Task bus — optional external tracker for cross-session work.
tasks:
  enabled: false
  providers:
    todoist:
      enabled: false
  autoDispatch: false
# Who "me" is — addresses that count as the user's own. Empty by default and
# never guessed: nothing is self-addressed until this is set.
identity:
  selfEmails: []
# Interactive-session settings (currently just the cache keepalive).
sessions:
  cacheKeepalive:
    # Off by default — arming it is the operator's explicit call.
    enabled: false
    # Beat a session once it has been idle at least this long; must be < the
    # provider's cache TTL (60 for the 1h ephemeral cache).
    idleMinutes: 50
    # Cap on consecutive beats per idle stretch.
    maxBeats: 6
    # Local time window outside which no beats are sent.
    activeHours: "08:00-22:00"
    # Skip sessions whose context is too small to be worth a beat.
    minContextTokens: 20000
    # The exact word typed into the session.
    prompt: keepalive
# Battery guard (src/daemon/battery-guard.ts; macOS only, no-op elsewhere).
# The daemon samples `pmset -g batt` and protects the battery from local-model
# work: new local workers and the scheduled memory index/embed passes are
# refused below pauseBelowPct, running local work stops cleanly at
# stopBelowPct (salvage as on any stop, recorded in the ledger), and admission
# reopens only above pauseBelowPct + hysteresisPct. A battery that falls while
# on AC is warned to the daemon log and the cockpit, never acted on.
# Cloud workers and interactive sessions are never touched.
power:
  batteryGuard:
    enabled: true
    # Seconds between pmset readings.
    intervalSecs: 60
    # Refuse new local-model work at or below this percent.
    pauseBelowPct: 25
    # Stop running local-model work at or below this percent.
    stopBelowPct: 12
    # Admission resumes only above pauseBelowPct + this many percent.
    hysteresisPct: 10
    # Readings the draining-on-AC check looks back over (10 × 60 s = 10 min).
    drainWindowReadings: 10
    # Benchmark runs (strata-bench, the night queue, any run labelled benchmark)
    # are never paused: telemetry is recorded once a minute and the guard warns.
    # Last resort, leaving time to save: stop at or below this percent ...
    benchmarkStopBelowPct: 15
    # ... or earlier when the drain rate projects this percent ...
    benchmarkProjectFloorPct: 10
    # ... within this many minutes.
    benchmarkProjectMins: 20
    # A stopped benchmark item gets this long after SIGTERM to write its files.
    benchmarkSaveSecs: 120

# Worker settings.
# PAI_HOME versioning: when PAI_HOME is a git repository, commit PAI's own
# config writes (config set, antipatterns set/promote/enforce/retire/label,
# workers.yaml edits) as "config: <what changed>". Set autoCommit false to stop.
home:
  autoCommit: true
workers:
  merge:
    # Globs of generated files. When a `pai worker merge` conflicts only in
    # these (plus pure-addition clashes, which are union-merged), the merge
    # takes our side, runs `regenerate`, stages these paths and completes.
    generated:
      - "docs/commands/**"
    # Shell command, run in the target checkout, that rewrites the generated files.
    regenerate: "npm run build"
    # Rebuild dist/ after a merge that lands in the PAI checkout the running `pai` comes from
    # (`pai worker merge --no-build` skips it once). A failed build never reverts the merge.
    rebuild: true
    # Globs where add-only clashes on both sides are union-merged.
    union:
      - "docs/**"
      - "*.md"
      - "CHANGELOG.md"
      - "src/cli/registry.ts"
    # Verify command run in the checkout after a successful `pai worker merge`
    # (typecheck + the kept core in tests/KEPT.md). A failure reverts the merge.
    # Empty string = off; `--no-verify-tests` skips one merge.
    verify: "npx tsc --noEmit && PAI_VITEST_MAX_WORKERS=2 npx vitest run"
    verifyTimeoutSec: 600
# Obsidian sync into the PAI-generated vault. Gates only writing; vault
# indexing is vaultIndex.
obsidian:
  enabled: false
# Read-only indexing of vaultPath for memory search. Independent of
# obsidian.enabled.
vaultIndex:
  enabled: true
# Index <PAI home>/lessons (review-gated lessons) for memory search.
lessonsIndex:
  enabled: true
# `pai lessons propose --draft`: candidates kept after ranking by strength.
lessons:
  draft:
    max: 10
    # model calls per transcript, and total seconds for all of them
    maxChunks: 40
    timeoutSec: 600
    # user messages per model call after the correction pre-filter
    batchMessages: 8
# Harness session ingestion (src/harness): names from the adapter registry
# (claude-code, codex). Read-only; an adapter whose store is absent never runs.
harness:
  adapters: [claude-code]
# Keep `pai router` (127.0.0.1:8790) running under the daemon.
router:
  enabled: false
  # TCP port the router listens on; every router URL (worker routing, cockpit links) derives from it.
  port: 8790
  # Upstream for claude-* model ids (inbound auth is passed through).
  claudeUpstream: https://api.anthropic.com
  # Bare aliases (besides ids starting with claude-) that also go to claudeUpstream.
  claudeModelAliases: [sonnet, opus, haiku, default, opusplan]
  # Guard rules on model replies (tool_use blocks, final text): off | monitor | enforce. Monitor records firings with source proxy
  # (see `pai antipatterns stats --source proxy`) and never changes, delays or blocks a reply. Enforce additionally rewrites a
  # tool call the rules deny — per pattern this happens only when the pattern's own `proxy` field is enforce
  # (`pai antipatterns set <id> proxy enforce`); shipped patterns stay monitor.
  guard:
    mode: off
  bind: loopback
  # Tool-call repair rules (src/router/tool-call-rules.ts). Files live in <PAI home>/<dir>/;
  # providers maps a provider (or provider -> model, "*" = any) to a file that starts with
  # `inherits: default`. Unmapped providers use the shipped rules. See docs/commands/models.md.
  toolCallRules:
    dir: tool-call-rules
  # `pai models rules list` marks a rule stale after this many days without a hit.
  toolCallRulesStaleDays: 14
  # Extra Host headers the router accepts beyond loopback and the bind address
  # (tailnet/MagicDNS names the cockpit is opened by). Empty by default; a
  # request whose Host matches none of these is refused with 403.
  allowedHosts: []
  # Milliseconds a stopping router waits for in-flight requests before force-closing.
  drainMs: 120000
  # Zero-downtime handover: the new router takes every new connection at once; the old
  # one finishes its in-flight requests (long local-engine streams) for at most this
  # many seconds, then ends them with a retryable error and exits.
  handover:
    drainMaxSecs: 1800
  # Daemon watchdog: after this many consecutive cloud requests failed with a network error
  # (ENOTFOUND, ECONNREFUSED, ETIMEDOUT) within 60 s while the daemon itself reaches the upstream,
  # the daemon restarts the router.
  watchdog:
    failStreak: 5
  # Cockpit page layout policy (src/router/cockpit-layout.ts): tile min/max
  # widths, chart heights, sample/history window lengths, refresh intervals,
  # row limits. Card arrangement is the windowing registry's, not config's.
  # Read at page build time; a user config.yaml/json override changes the served page. Pure
  # styling (fonts, colours from the theme mapping) stays in the page's CSS.
  cockpit:
    # Rows the operator never wants to see (edited from the cockpit's "hide" controls and
    # "Hidden" editor). A rule: match = case-insensitive substring or /regex/; in = lists it
    # applies to (sessions, runs, timeline, search; default all); note = why. Example:
    #   - { match: keepalive, in: [sessions, runs, timeline, search], note: cache keepalive beats }
    hide: []
    # "Sessions by tokens" prompt search: the raw-transcript scan covers only transcripts modified
    # in the last recentHours hours (newest first, fast); older sessions come from PAI's memory index.
    search:
      recentHours: 48
    layout:
      # cloud/local gauge tiles (flex row): base width, cap.
      gaugeMinWidthPx: 110
      gaugeMaxWidthPx: 120
      # cache rings grid: min column width.
      ringMinWidthPx: 92
      # model colours: palette in assignment order (sorted model names, kept
      # per name in the browser). Well-separated mid-tones, readable on the
      # dark and the light theme; the first four are the token-kind colours.
      palette:
        - "#3b6fe0"
        - "#e0703b"
        - "#2e9e5b"
        - "#b04fd0"
        - "#d9b31c"
        - "#2bb3c0"
        - "#d64570"
        - "#7a8a99"
        - "#8fbf3f"
        - "#a0522d"
        - "#6a5acd"
        - "#1f8a70"
        - "#c2c24a"
        - "#4d8bc9"
        - "#c96a9b"
        - "#57a64a"
        - "#b38f2d"
        - "#3aa0d6"
        - "#9b59b6"
        - "#d07a35"
        - "#4a9e8f"
        - "#8a7f5a"
        - "#c05a5a"
        - "#6f9e3c"
      # sessions table: max width of the title column.
      sessionTitleMaxWidthPx: 480
      # metric-tile sparkline: height, viewBox width, plot top, plot height.
      sparkHeightPx: 32
      sparkViewMaxPx: 100
      sparkPlotHeightPx: 28
      sparkPlotTopPx: 30
      # cache donut: ring size, radius, stroke width, viewBox size.
      donutSizePx: 84
      donutRadiusPx: 48
      donutStrokePx: 16
      donutViewBoxPx: 140
      # time-axis labels keep at least this many px between neighbours (every k-th bucket
      # is labelled); bar charts keep bars at least minBarPx wide by merging buckets.
      minLabelGapPx: 48
      minBarPx: 3
      # System tiles: polls kept per metric for the sparkline when the server keeps no series of it.
      sysHistoryLen: 60
      # history window of the "Tokens per day per model" chart, in days.
      dailyDays: 14
      # table row limits: sessions by tokens, worker runs.
      sessionsRows: 20
      # sessions beyond the top N by tokens collapse into one expandable row;
      # the session-name column is capped at this percent of the table width.
      sessionsTopRows: 10
      # turns kept in the per-session drill-down (the last N).
      sessionDetailTurns: 200
      sessionNameMaxPct: 35
      workerRows: 15
      # least width (px) of the scan-findings column of the runs table; the
      # compact form ("1b 2c 3w") fits it, the full text rides in the cell's title.
      runsFindingsMinWidthPx: 72
      # models under this many requests render as chips, not rings.
      lowRequestMin: 5
      # saved model colours (browser storage) older than this many days are
      # pruned; a model that is merely not visible right now keeps its colour.
      colorPruneDays: 90
      # refresh intervals of the page's polls.
      pollMs: 5000
      limitsPollMs: 30000
      poolPollMs: 15000
      clockTickMs: 1000
      # the stamp reads "stale" past this age, in seconds.
      stampStaleSecs: 15
      # a failed fetch or a payload marked transient keeps the last good one on screen this long (marker "stale · 42 s · reason"), then the error shows.
      holdLastGoodSecs: 120
      # a local switch/off job: first delay, poll interval, max tries.
      jobFirstDelayMs: 2000
      jobPollMs: 5000
      jobMaxTries: 120
      # bounds of the parallel-runs +/- stepper on a provider card in the Models section.
      concurrencyMin: 1
      concurrencyMax: 16
      # a server prefix-cache counter older than this (seconds) is marked.
      serverCounterStaleSecs: 60
      # colour thresholds, stated per pair: for a limits gauge and an error
      # rate higher is worse — a value at/above the Bad threshold colours red,
      # at/above the Warn threshold amber, below the Warn threshold green. For
      # the cache hit ratio lower is worse — below the Bad threshold red,
      # below the Warn threshold amber, at/above the Warn threshold green.
      # gaugeWarnPct/gaugeBadPct are percentages of a limits gauge; the others
      # are ratios (0..1) of a cache hit ratio or an error rate.
      gaugeWarnPct: 70
      gaugeBadPct: 90
      hitWarn: 0.8
      hitBad: 0.5
      errorWarn: 0.02
      errorBad: 0.1
      # Memory section: title, refresh interval (ms), embedding coverage ratios
      # (below Warn amber, below Bad red), seconds a started run may take to
      # show its progress before the card stops reading "starting".
      memoryTitle: Memory
      memoryPollMs: 5000
      memoryCoverageWarn: 0.99
      memoryCoverageBad: 0.5
      memoryStartGraceSecs: 120
      memoryLessonsTop: 5
    probe:
      # a local server whose TCP connect or /v1/models answer times out is busy, not down;
      # it turns down after this many consecutive timeouts (refused / not serving = down at once)
      timeoutStrikes: 3
      # TCP connect timeout of the local-server probe
      tcpTimeoutMs: 3000
      # the router logs one line when its event loop is blocked longer than this, naming the requests in flight
      stallLogMs: 1000
  # Request scheduling for local engines (src/router/scheduler.ts): one request
  # in flight per engine, fair across the workers' owning sessions.
  scheduling:
    enabled: true
    # Virtual-token weight of a fresh prefill token.
    wTokIn: 1
    # Virtual-token weight of a decode token.
    wTokOut: 2
    # Seconds a request may wait before it goes next regardless.
    agingSec: 120
    # Per-session weight overrides; a session not named here weighs 1.
    sessionWeights: {}
    # A worker whose last turn ended under this long ago still has its prefix
    # cached (milliseconds).
    warmMs: 300000
    # Queued-stream ping interval of the router (milliseconds).
    pingMs: 15000
    # Worker priority at a serial engine: high is admitted before normal before
    # low. A low request waiting longer than this (seconds) gets one turn
    # although higher ones wait; the span restarts after each low admission.
    lowAgingSec: 900
  # Park an idle local conversation to disk while its worker waits on a long
  # build gate (src/router/parking.ts). Needs the engine started with
  # `--slot-save-path <PAI home>/state/strata-slots`.
  parking:
    enabled: false
    # Park only when the expected build wait exceeds this many seconds.
    parkAfterSec: 120
  # Cockpit Models cards: the live sampler of running runtimes
  # (src/router/runtime-samples.ts).
  samples:
    # Sampling cadence of the ring, in milliseconds.
    sampleMs: 5000
    # Samples kept per runtime: 60 × 5 s = the last 5 minutes.
    historyLen: 60
    # An engine's own status endpoint must answer within this, in milliseconds;
    # a slow engine is simply not reported.
    engineStatusTimeoutMs: 1000
    # How old the card reading served from /cockpit/models may be before a new
    # one is taken, in milliseconds.
    cardReadingMaxAgeMs: 2000

# Cockpit Models cards: the title of PAI's own embedding consumer (the purpose
# of the model). Override in ~/.pai/config.yaml under models.embeddingLabel.
models:
  embeddingLabel: PAI memory embeddings
  # The start/stop/ready commands `pai models start|stop` and the cockpit's
  # runtime buttons run (src/workers/model-runtimes.ts). A runtime with no
  # command shows no button. Your entries in config.yaml in the PAI home win per key.
  runtimes:
    ollama:
      start: ollama serve
      stop: kill $(lsof -nP -iTCP:11434 -sTCP:LISTEN -t)
      ready: http://127.0.0.1:11434/api/tags
      note: local Ollama server; loads a model on the first request
    docker-model-runner:
      start: docker model run
      stop: docker model unload
      ready: docker model status
      note: idle loads a model on the first request
# Worker panes (src/workers/pane*.ts; read through src/workers/pane-policy.ts).
panes:
  # Smallest pane a worker may be placed in; guides which pane is split. A small pane is never a violation.
  minCols: 40
  minRows: 6
  # Verify a new pane: attempts and the poll interval between them.
  verifyTries: 25
  verifyPollMs: 300
  # Session-map entries older than this are ignored.
  sessionMapMaxAgeDays: 7
  # Longest pane title, in characters.
  titleMax: 40
  # Chat status-line refresh interval.
  statusTickMs: 1000
  # Pane exec wrapper: wait for its hello, grace before SIGKILL, socket connect.
  helloWaitSecs: 20
  killGraceSecs: 3
  connectSecs: 10
  # Pane run: seconds the last line stays visible before the pane closes,
  # poll interval, how long ended entries are kept, tail lines in the footer.
  lingerSecs: 5
  # Pane exec wrapper: seconds the pane stays after its process ended, then
  # closes, whatever the end (a failure stays readable with `pai worker replay <id>`).
  exitLingerSecs: 8
  runPollMs: 250
  runKeepHours: 24
  tailLines: 40
  # Pane audit: processes younger than startGraceSecs, or ended within
  # endGraceSecs, are not judged; a wrapper outliving its child by
  # launchGraceSecs is an orphan.
  audit:
    startGraceSecs: 30
    endGraceSecs: 60
    launchGraceSecs: 15
    # A running worker whose pane vanished (terminal crash) gets a new pane, retried with backoff;
    # only when none can be opened for this long is the worker stopped.
    reopenGraceSecs: 600

# Release steps (src/builds/mirror-sync.ts, npm-auth.ts).
release:
  # Name of the environment variable holding the forge (Gitea/Forgejo) token
  # for `pai build mirror-sync`. The token itself is never stored or printed.
  forgeTokenEnv: AIBROKER_FORGE_TOKEN
