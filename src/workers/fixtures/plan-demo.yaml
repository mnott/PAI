job: demo
repo: .
gate: npx tsc --noEmit
provider: local
max_parallel: 2
preamble: Follow the repo conventions. Keep the change minimal.
units:
  - id: parser
    unit_check: node scripts/parity.mjs
    parts:
      - id: p1
        spec: Add the tokenizer.
        files: [src/tok.ts]
        proof: npx vitest run src/tok.test.ts
      - id: p2
        spec: Add the grammar.
        files: [src/grammar.ts]
        depends_on: [p1]
        risky: true
  - id: cli
    parts:
      - id: c1
        spec: Add the flag.
        files: [src/cli.ts]
      - id: c2
        spec: Document the flag.
        files: [src/cli.ts, docs/cli.md]
      - id: c3
        spec: Wire the parser into the CLI.
        files: [src/wire.ts]
        depends_on: [p2, c1]
