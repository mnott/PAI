# Installing a crontab persists a scheduled command.
id: crontab-persistence
severity: confirm
match: /(?:^|[;&|(`\n]|\$\()\s*(?:sudo\s+(?:-\S+\s+)*)?crontab\s+(?:-\S+\s+)*[^\s|;&]+\.\w+(?:\s|$)/m
reason: installing a crontab file persists a scheduled command
tests:
  match:
    - crontab cronfile.txt
  no_match:
    - crontab -l
