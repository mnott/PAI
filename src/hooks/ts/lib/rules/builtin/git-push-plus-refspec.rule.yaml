# A plus-prefixed refspec forces the update without -f.
id: git-push-plus-refspec
severity: confirm
match: /\bgit\b.*\spush\b.*\s\+\S/i
reason: a plus-prefixed refspec forces the remote update without -f
tests:
  match:
    - git push origin +main
    - git push origin '+main'
  no_match:
    - git push origin main
