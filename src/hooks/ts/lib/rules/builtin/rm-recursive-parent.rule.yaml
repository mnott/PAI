# Recursive deletion of the parent directory.
id: rm-recursive-parent
severity: block
quoted: true
category: catastrophic_deletion
match: /(?:^|[;&|(`\n]|\$\(|\b(?:sh|bash|zsh)\s+-\w*c\s+["'])\s*(?:sudo\s+(?:-\S+\s+)*)?rm\s+(?:-[rfivd]+\s+)*\.\.\/\s*["']?\s*$/m
reason: recursive rm of ../ deletes the parent directory
tests:
  match:
    - bash -c "rm -rf ../"
    - rm -rf ../
  no_match:
    - rm -rf ../build
