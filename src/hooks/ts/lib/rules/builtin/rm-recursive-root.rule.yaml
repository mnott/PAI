# Recursive rm of /, ~, $HOME or a system directory.
# The destructive verb must sit in command position (line start, after
# ; & | ( ` $( or sudo), so `~`, `/` and `-` inside awk programs or python
# strings never match on their own.
id: rm-recursive-root
severity: block
match: /(?:^|[;&|(`\n]|\$\()\s*(?:sudo\s+(?:-\S+\s+)*)?rm\s+(?:-\S+\s+)*(?:-\w*[rR]\w*|--recursive)\s+(?:-\S+\s+)*(?:\S+\s+)*(?:\/\*?|~\/?\*?|\$\{?HOME\}?\/?\*?|\/(?:usr|etc|bin|sbin|lib|var|opt|home|System|Library|Users|Applications)\/?\*?)(?=\s|;|&|\||$)/m
reason: recursive rm aimed at /, the home directory or a system directory
tests:
  match:
    - rm -rf /
    - rm -rf ~
    - rm -rf $HOME
    - sudo rm -rf /usr
    - rm -rf "/"
    - rm -rf "$HOME"
    - rm -rf '/'
  no_match:
    - rm -rf /tmp/build
    - rm -rf ~/tmp/build
    - awk -F'\t' '$2 ~ /-anthropic-precise-00/ {print $1,$3,$8,$9}' file
    - "python3 -c \" import math\ndef distance(p, a, b): return abs((b[0]-a[0])*(a[1]-p[1]) - (a[0]-p[0])*(b[1]-p[1])) / max(math.hypot(a[0]-b[0], a[1]-b[1]), 1e-9) ~ 1 \""
